services:
  # ==============================================================================
  # Hospitrack Healthcare SaaS Platform (Unified Single-Service Web Service)
  # Orchestrates Node.js reverse proxy & Spring Boot 3 Java backend in one container
  # ==============================================================================
  - type: web
    name: hospitrack
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: hospitrack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 3600000
      - key: JWT_REFRESH_EXPIRATION_MS
        value: 604800000
      - key: FRONTEND_URL
        value: http://localhost:8000,http://127.0.0.1:8000,http://localhost:10000,http://127.0.0.1:10000
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: no-reply@hospitrack.com
      - key: BREVO_SENDER_NAME
        value: Hospitrack Production
      - key: INITIAL_ADMIN_EMAIL
        value: admin@hospitrack.com
      - key: INITIAL_ADMIN_PASSWORD
        sync: false

# ==============================================================================
# Managed PostgreSQL Database
# ==============================================================================
databases:
  - name: hospitrack-db
    databaseName: hospitrack_prod
    user: hospitrack_user
    plan: free
    region: oregon
